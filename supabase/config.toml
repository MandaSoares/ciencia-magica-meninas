project_id = "iintsexwxemwycczvkyd"
# Configuração de autenticação (aplicar no projeto hospedado com `supabase config push`
# ou copiando os valores para o painel: Authentication → Sign In / Providers, Emails, URL Configuration).
[auth]
site_url = "https://ciencia-magica-meninas.vercel.app"
additional_redirect_urls = [
  "https://ciencia-magica-meninas.vercel.app/**",
  "http://localhost:8080/**",
]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Seu código do Conscientistas"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Criar uma nova senha no Conscientistas"
content_path = "./supabase/templates/recovery.html"
